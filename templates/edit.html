{{define "content"}}

{{with .Post}}

<div class="edit-post-form">
    <h1>Edit Post</h1>

    <form
        action="/posts/{{.ID}}/edit"
        method="post"
        enctype="multipart/form-data"
    >

        <label>
            Title
            <input
                type="text"
                name="title"
                value="{{.Title}}"
                required
            >
        </label>

        <label>
            Game Title
            <input
                type="text"
                name="game_title"
                value="{{.GameTitle}}"
            >
        </label>

        <label>
            Content
            <textarea
                name="content"
                required
            >{{.Content}}</textarea>
        </label>

        {{if .Images}}
        <p>Current images (click × to remove, or replace below):</p>
        <div class="post-thumb-gallery">
            {{range $i, $img := .Images}}
            <div class="post-thumb-item">
                <input
                    type="checkbox"
                    name="remove_images"
                    value="{{$img}}"
                    id="remove-img-{{$i}}"
                    class="remove-thumb-toggle"
                >
                <img
                    src="{{$img}}"
                    alt="{{$.Post.Title}}"
                    class="post-thumb"
                >
                <label for="remove-img-{{$i}}" class="remove-thumb-x" aria-label="Remove this image"></label>
                <span class="remove-thumb-overlay">Removed</span>

                <div class="thumb-replace">
                    <label class="thumb-replace-label">
                        <span>File</span>
                        <input type="file" name="replace_file_{{$i}}" accept="image/*,.gif">
                    </label>
                    <label class="thumb-replace-label">
                        <span>URL</span>
                        <input type="url" name="replace_url_{{$i}}" placeholder="https://example.com/image.gif">
                    </label>
                </div>
            </div>
            {{end}}
        </div>
        {{end}}

        <label>
            Add images / GIFs from your computer
            <input type="file" name="images" accept="image/*,.gif" multiple>
        </label>
        <p class="hint">You can select multiple files at once (ctrl/cmd-click).</p>

        <div id="url-group">
            <label>
                Add image URL
                <input type="url" name="image_urls" placeholder="https://example.com/image.gif">
            </label>
        </div>

        <button type="button" id="add-url-btn" class="btn-secondary small">
            + Add another URL
        </button>

        <fieldset>
            <legend>Categories</legend>

            {{range $.Categories}}
            <label class="category-check">
                <input
                    type="checkbox"
                    name="category_ids"
                    value="{{.ID}}"
                    {{if $.Post.HasCategory .ID}}checked{{end}}
                >
                {{.Name}}
            </label>
            {{end}}
        </fieldset>

        <label>
            New category (comma-separated, optional)
            <input
                type="text"
                name="new_categories"
                placeholder="e.g. Roguelike, Metroidvania"
            >
        </label>

        <button type="submit">Save Changes</button>

    </form>
</div>

<script>
document.getElementById('add-url-btn').addEventListener('click', function () {
    const group = document.getElementById('url-group');
    const row = document.createElement('label');
    row.innerHTML = `
        Add image URL
        <input type="url" name="image_urls" placeholder="https://example.com/image.gif">
    `;
    group.appendChild(row);
});
</script>

{{end}}

{{end}}
