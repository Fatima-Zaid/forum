{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Forum</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="/" class="brand">Certified Noob Zone</a>
            {{if .User}}
                <details class="profile-menu">
                    <summary class="profile-avatar-btn" aria-label="Profile menu">
                        <svg class="avatar-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                            <rect x="6" y="2" width="4" height="4" fill="var(--text-light)"/>
                            <rect x="4" y="7" width="8" height="6" fill="var(--text-light)"/>
                        </svg>
                    </summary>
                    <div class="profile-dropdown">
                        <a href="/profile">Profile</a>
                        <form action="/logout" method="POST">
                            <button type="submit">Logout</button>
                        </form>
                    </div>
                </details>
            {{else}}
                <a href="/login">Login</a>
                <a href="/register">Register</a>
            {{end}}
        </nav>
    </header>

    {{with flashSuccess}}
    <div class="toast-banner toast-success">
        <span>{{.}}</span>
        <a href="?" class="toast-close" aria-label="Dismiss">✕</a>
    </div>
    {{end}}

    {{with flashError}}
    <div class="toast-banner toast-error">
        <span>{{.}}</span>
        <a href="?" class="toast-close" aria-label="Dismiss">✕</a>
    </div>
    {{end}}

    <main>
        {{template "content" .}}
    </main>
</body>
</html>
{{end}}
