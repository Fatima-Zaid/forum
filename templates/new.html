{{define "content"}}

<div class="form-container">
    <h1>Create New Post</h1>

    <form action="/posts" method="post" enctype="multipart/form-data">

        <label>
            Title
            <input
                type="text"
                name="title"
                required
                placeholder="Post title"
            >
        </label>

        <label>
            Game Title
            <input
                type="text"
                name="game_title"
                required
                placeholder="Game title"
            >
        </label>

        <label>
            Content
            <textarea
                name="content"
                required
                placeholder="Write your post..."
            ></textarea>
        </label>

        <label>
            Image / GIF from your computer
            <input
                type="file"
                name="image"
                accept="image/*,.gif"
            >
        </label>

        <label>
            Image / GIF URL
            <input
                type="url"
                name="image_url"
                placeholder="https://example.com/image.gif"
            >
        </label>

        <fieldset>
            <legend>Categories</legend>

            {{range .Categories}}
            <label class="category-check">
                <input
                    type="checkbox"
                    name="category_ids"
                    value="{{.ID}}"
                >
                {{.Name}}
            </label>
            {{end}}
        </fieldset>

        <label>
            New category (comma-separated, optional)
            <input
                type="text"
                name="new_categories"
                placeholder="e.g. Roguelike, Metroidvania"
            >
        </label>

        <button type="submit">Create Post</button>

    </form>
</div>

{{end}}
